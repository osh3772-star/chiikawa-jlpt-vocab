<details id="bgm-player" class="cv-bgm-player">
  <summary>♫ 내 MP3 플레이어 <span>파일 선택 · 재생</span></summary>
  <div class="cv-bgm-content">
    <p id="bgm-local-note">파일은 서버에 업로드하지 않습니다. 이 페이지에서만 재생되며, 페이지 이동·새로고침 후에는 다시 선택해 주세요. 자동재생은 꺼져 있습니다.</p>
    <label for="bgm-files">MP3 파일 선택 (여러 곡 가능)</label>
    <input id="bgm-files" type="file" accept=".mp3,audio/mpeg" multiple aria-describedby="bgm-local-note">
    <label for="bgm-track">재생할 곡</label>
    <select id="bgm-track" disabled><option value="">선택한 곡 없음</option></select>
    <div class="cv-bgm-transport" role="group" aria-label="음악 재생 조작">
      <button type="button" id="bgm-prev" disabled>이전곡</button>
      <button type="button" id="bgm-play" aria-label="음악 재생" aria-pressed="false" disabled>재생</button>
      <button type="button" id="bgm-stop" disabled>정지 (처음으로)</button>
      <button type="button" id="bgm-next" disabled>다음곡</button>
    </div>
    <div class="cv-bgm-preferences">
      <label for="bgm-volume">음량 <output id="bgm-volume-value" for="bgm-volume">50%</output><input id="bgm-volume" type="range" min="0" max="100" step="1" value="50"></label>
      <label for="bgm-repeat">반복<select id="bgm-repeat"><option value="off">반복 안 함</option><option value="all">전체 반복</option><option value="one">한 곡 반복</option></select></label>
      <button type="button" id="bgm-clear" disabled>파일 선택 해제</button>
    </div>
    <p id="bgm-status" role="status" aria-live="polite" aria-atomic="true">MP3 파일을 선택해 주세요.</p>
    <p id="bgm-preferences-status">음량·반복 설정만 이 브라우저에 저장됩니다. 파일·곡 목록·재생 위치는 저장하지 않습니다.</p>
  </div>
</details>
