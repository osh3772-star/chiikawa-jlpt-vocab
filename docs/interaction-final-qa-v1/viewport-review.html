<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>격리 QA · 문서 viewport 검수</title>
<style>body{margin:0;background:#eef1f5;font:14px system-ui,sans-serif;color:#18212b}header{padding:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:white;border-bottom:1px solid #ccc}label{display:flex;align-items:center;gap:5px}select{font:inherit;padding:5px}main{padding:10px;width:max-content;min-width:calc(100% - 20px)}iframe{display:block;border:0;background:white;box-shadow:0 0 0 1px #aaa}small{display:block;padding:8px 10px}</style></head>
<body><header><strong>격리 QA</strong><label>페이지<select id="page"><option value="study.html">공부</option><option value="index.html">시작</option><option value="character-settings.html">캐릭터 설정</option></select></label><label>문서 크기<select id="size"><option value="390,640">390 × 640</option><option value="320,568">320 × 568</option><option value="1280,800">1280 × 800</option></select></label><span id="current">390 × 640</span></header>
<small>실제 iframe 문서 viewport 검수입니다. 물리 터치·실제 휴대폰·GUI 확대 검증이 아닙니다. 합성 학습 데이터만 사용하세요.</small><main><iframe id="review" title="격리 QA 문서" width="390" height="640" src="study.html"></iframe></main>
<script>(()=>{'use strict';const frame=document.getElementById('review'),page=document.getElementById('page'),size=document.getElementById('size');page.addEventListener('change',()=>{frame.src=page.value;});size.addEventListener('change',()=>{const [w,h]=size.value.split(',').map(Number);frame.width=w;frame.height=h;document.getElementById('current').textContent=w+' × '+h;});})();</script></body></html>
