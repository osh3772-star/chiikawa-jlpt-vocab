<!doctype html>
<html lang="ko"><head><script src="qa-isolation.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QA · 단어 공부 · JLPT 단어장</title><link rel="stylesheet" href="app.css"></head><body data-page="study">
  <div class="scenery" aria-hidden="true"><span class="sun"></span><span class="cloud cloud-one"></span><span class="cloud cloud-two"></span><span class="hill hill-one"></span><span class="hill hill-two"></span></div>
<nav class="cv-page-nav" aria-label="페이지 이동"><a data-cv-link href="index.html">시작</a><a data-cv-link href="character-settings.html">캐릭터 설정</a><a data-cv-link href="study.html" aria-current="page">공부 이어하기</a></nav><p id="navigation-status" role="status" tabindex="-1"></p><header class="site-header"><p class="header-sticker" lang="ja">ひとつずつ、ゆっくり。</p><h1>QA · 합성 데이터 전용 · 단어 공부 · JLPT 단어장</h1><p class="header-description">내 속도로, 한 단어씩.</p><p id="storage-note">급수별 위치와 학습 기록은 이 브라우저에 자동 저장됩니다.</p></header><main>    <section id="study" aria-label="단어 학습 화면">
      <div class="study-toolbar">
      <button id="go-home" type="button">메인 화면으로</button>
      <label for="level">급수</label>
      <select id="level">
        <option value="N5">N5 · 300개</option><option value="N4">N4 · 780개</option>
        <option value="N3">N3 · 1,100개</option><option value="N2">N2 · 2,100개</option>
        <option value="N1">N1 · 2,900개</option>
      </select>
      </div>
      <h2 id="study-title">전체 단어 학습</h2>
      <p class="keyboard-hint">← 이전 단어 / → 다음 단어 / ↑ 알고 있음 + 다음 / ↓ 모르겠음 + 다음</p>
      <p id="position"></p>
      <progress id="progress" value="0" max="1" aria-label="학습 진행"></progress>
      <p id="counts"></p>
      <article id="card" aria-label="현재 단어">
        <h2 id="word" lang="ja"></h2>
        <p id="reading" lang="ja"></p>
        <p id="meaning"></p>
        <h3>예문</h3>
        <p id="example" lang="ja"></p>
        <p id="translation"></p>
        <p id="answer"></p>
      </article>
      <nav aria-label="단어 학습">
        <button id="prev" type="button">← 이전</button>
        <button id="known" type="button">↑ 알고 있음</button>
        <button id="unknown" type="button">↓ 모르겠음</button>
        <button id="next" type="button">다음 →</button>
        <button id="undo-answer" type="button" disabled>방금 답변 취소</button>
      </nav>
      <p id="message" role="status" aria-live="polite"></p>
    </section>
</main><script src="navigation.js"></script><script src="pet-data.js"></script><script src="pet-runtime.js"></script><script src="vocabulary.js"></script><script src="study-runtime.js"></script></body></html>
